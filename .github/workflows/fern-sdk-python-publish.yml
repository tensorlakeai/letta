name: 🌿 Release Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version of the Python SDK that you would like to release"
        required: true
        type: string
  workflow_run:
    workflows: ["🌿 Preview Python SDK"]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download Fern
        run: "npm install --global --ignore-scripts pnpm@11.28.5\nmkdir -p \"$RUNNER_TEMP/fern-tools\"\npnpm --dir \"$RUNNER_TEMP/fern-tools\" \\\n  --config.minimumReleaseAge=1440 --config.minimumReleaseAgeStrict=true \\\n  --config.minimumReleaseAgeIgnoreMissingTime=false --config.trustLockfile=false \\\n  --config.blockExoticSubdeps=true --config.strictDepBuilds=true \\\n  --config.optimisticRepeatInstall=false \\\n  add --ignore-scripts --save-exact fern-api@5.148.2\necho \"$RUNNER_TEMP/fern-tools/node_modules/.bin\" >> \"$GITHUB_PATH\"\n"

      - name: Generate Python SDK
        working-directory: .
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            fern generate --group python-sdk --version ${{ inputs.version }} --log-level debug
          else
            fern generate --group python-sdk --log-level debug
          fi

      - name: Publish Docs
        working-directory: .
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --docs
